[versions]

[libraries]
tinify = "com.tinify:tinify:1.6.4"
google-oss-license = "com.google.android.gms:oss-licenses-plugin:0.10.6"

# AndroidX — stable, compatible with AGP 8.1.4 / compileSdk 35 / Kotlin 1.9.22
androidx-annotation = "androidx.annotation:annotation:1.9.1"
androidx-appcompat = "androidx.appcompat:appcompat:1.7.0"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.3.2"
androidx-core-ktx = "androidx.core:core-ktx:1.15.0"
androidx-lifecycle-common = "androidx.lifecycle:lifecycle-common:2.8.7"
androidx-lifecycle-livedata-ktx = "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
androidx-lifecycle-runtime-ktx = "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
androidx-lifecycle-viewmodel-ktx = "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
androidx-preference-ktx = "androidx.preference:preference-ktx:1.2.1"
androidx-navigation-runtime-ktx = "androidx.navigation:navigation-runtime-ktx:2.7.7"
androidx-navigation-ui-ktx = "androidx.navigation:navigation-ui-ktx:2.7.7"
androidx-navigation-fragment-ktx = "androidx.navigation:navigation-fragment-ktx:2.7.7"
androidx-browser = "androidx.browser:browser:1.8.0"
androidx-startup = "androidx.startup:startup-runtime:1.2.0"
androidx-work-runtime-ktx = "androidx.work:work-runtime-ktx:2.9.1"
androidx-datastore-preferences = "androidx.datastore:datastore-preferences:1.1.1"
google-material = "com.google.android.material:material:1.12.0"
androidx-security-crypto-ktx = "androidx.security:security-crypto-ktx:1.1.0-alpha06"
androidx-splashscreen = "androidx.core:core-splashscreen:1.0.1"

free-reflection = "com.github.tiann:FreeReflection:3.1.0"
viewbinding-property-delegate = "com.github.kirich1409:viewbindingpropertydelegate-noreflection:1.5.9"
bumptech-glide = "com.github.bumptech.glide:glide:4.16.0"
squareup-okhttp = "com.squareup.okhttp3:okhttp:4.12.0"
squareup-retrofit = "com.squareup.retrofit2:retrofit:2.11.0"
squareup-retrofit-converter-moshi = "com.squareup.retrofit2:converter-moshi:2.11.0"
squareup-moshi = "com.squareup.moshi:moshi-kotlin:1.15.1"
squareup-leakcanary-startup = "com.squareup.leakcanary:leakcanary-android-startup:2.14"
squareup-leakcanary-core = "com.squareup.leakcanary:leakcanary-android-core:2.14"

play-services-oss-licenses = "com.google.android.gms:play-services-oss-licenses:17.1.0"

junit = "junit:junit:4.13.2"
androidx-junit = "androidx.test.ext:junit:1.2.1"
androidx-expresso-core = "androidx.test.espresso:espresso-core:3.6.1"

[bundles]
androidx-navigation = ["androidx-navigation-ui-ktx", "androidx-navigation-fragment-ktx", "androidx-navigation-runtime-ktx"]
androidx-lifecycle = ["androidx-lifecycle-common", "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-runtime-ktx", "androidx-lifecycle-viewmodel-ktx"]
androidx-test = ["androidx-junit", "androidx-expresso-core"]
squareup-leakcanary = ["squareup-leakcanary-startup", "squareup-leakcanary-core"]
